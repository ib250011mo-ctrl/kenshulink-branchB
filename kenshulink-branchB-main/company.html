<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運営会社 | ケンシュウリンク</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .company-table {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-m);
    box-shadow: var(--shadow-card);
    overflow: hidden;
  }
  .company-row {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 16px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--color-border);
  }
  .company-row:last-child { border-bottom: none; }
  .company-row dt { font-size: 13px; font-weight: 700; color: var(--color-ink); }
  .company-row dd { margin: 0; font-size: 13.5px; color: var(--color-ink-soft); }
  @media (max-width: 560px) {
    .company-row { grid-template-columns: 1fr; gap: 4px; }
  }
</style>
</head>
<body data-active-nav="">

<div id="site-header"></div>

<main class="detail-page" style="max-width:760px;">
  <p class="section__eyebrow">COMPANY</p>
  <h1 class="hero-band__title" style="font-size:26px; margin-bottom:24px;">会社概要</h1>

  <dl class="company-table">
    <div class="company-row">
      <dt>会社名</dt>
      <dd>〔運営会社名〕</dd>
    </div>
    <div class="company-row">
      <dt>設立</dt>
      <dd>〔設立年月日〕</dd>
    </div>
    <div class="company-row">
      <dt>代表者</dt>
      <dd>〔代表者役職・氏名〕</dd>
    </div>
    <div class="company-row">
      <dt>資本金</dt>
      <dd>〔資本金〕</dd>
    </div>
    <div class="company-row">
      <dt>従業員数</dt>
      <dd>〔従業員数〕（2026年◯月現在）</dd>
    </div>
    <div class="company-row">
      <dt>事業内容</dt>
      <dd>研修講師マッチングプラットフォーム「ケンシュウリンク」の企画・開発・運営</dd>
    </div>
    <div class="company-row">
      <dt>所在地</dt>
      <dd>〒〔郵便番号〕　〔住所〕</dd>
    </div>
  </dl>

  <p style="font-size:11.5px; color:var(--color-ink-soft); margin-top:16px;">※ 掲載内容はデモ表示です。実際の情報に差し替えてください。</p>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/layout.js"></script>
</body>
</html>
